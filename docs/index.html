<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROMANO: Campaign Growth Projection</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --obsidian-base: #0A0A0A;
            --deep-space: #1A1A1A;
            --electric-purple: #BF00FF;
            --lime-green: #32CD32;
            --hot-pink: #FF69B4;
            --pure-white: #FFFFFF;
            --muted-silver: #A0A0A0;
        }

        body {
            background-color: var(--obsidian-base);
            color: var(--pure-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .banner {
            background-color: var(--hot-pink);
            color: var(--obsidian-base);
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin-bottom: 60px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background-color: var(--deep-space);
            border: 1px solid var(--electric-purple);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(191, 0, 255, 0.1);
        }

        .chart-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--pure-white);
            text-align: center;
        }

        .table-container {
            background-color: var(--deep-space);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            border: 1px solid var(--electric-purple);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--muted-silver);
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid var(--electric-purple);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(191, 0, 255, 0.2);
        }

        tr:nth-child(even) {
            background-color: var(--obsidian-base);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="banner">
        PROJECTED DATA: This dashboard contains simulated estimates for strategic planning purposes.
    </div>

    <h1>AROMANO: Campaign Growth Projection</h1>

    <div class="container">
        <div class="charts-grid">
            <div class="chart-card">
                <h2>Traffic Growth</h2>
                <canvas id="trafficChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Conversion Volume</h2>
                <canvas id="conversionChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Churn Analysis</h2>
                <canvas id="churnChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const data = [
            { month: 'Month 1', visitors: 1693, conversions: 37, convRate: '2.2%', churnRate: 6.5 },
            { month: 'Month 2', visitors: 1896, conversions: 40, convRate: '2.1%', churnRate: 6.1 },
            { month: 'Month 3', visitors: 2105, conversions: 46, convRate: '2.2%', churnRate: 5.8 },
            { month: 'Month 4', visitors: 2316, conversions: 58, convRate: '2.5%', churnRate: 5.6 },
            { month: 'Month 5', visitors: 2524, conversions: 58, convRate: '2.3%', churnRate: 5.5 },
            { month: 'Month 6', visitors: 2726, conversions: 63, convRate: '2.3%', churnRate: 5.5 },
        ];

        const tbody = document.getElementById('dataTableBody');
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.month}</td><td>${row.visitors}</td><td>${row.conversions}</td><td>${row.convRate}</td><td>${row.churnRate}%</td>`;
            tbody.appendChild(tr);
        });

        const chartDefaults = {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#A0A0A0', font: { family: 'Inter' } } }
            },
            scales: {
                x: {
                    grid: { color: 'rgba(160, 160, 160, 0.1)' },
                    ticks: { color: '#A0A0A0' }
                },
                y: {
                    grid: { color: 'rgba(160, 160, 160, 0.1)' },
                    ticks: { color: '#A0A0A0' }
                }
            }
        };

        new Chart(document.getElementById('trafficChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.month),
                datasets: [{
                    label: 'Visitors',
                    data: data.map(d => d.visitors),
                    borderColor: '#BF00FF',
                    backgroundColor: 'rgba(191, 0, 255, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: chartDefaults
        });

        new Chart(document.getElementById('conversionChart'), {
            type: 'bar',
            data: {
                labels: data.map(d => d.month),
                datasets: [{
                    label: 'Conversions',
                    data: data.map(d => d.conversions),
                    backgroundColor: '#32CD32'
                }]
            },
            options: chartDefaults
        });

        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.month),
                datasets: [{
                    label: 'Churn Rate %',
                    data: data.map(d => d.churnRate),
                    borderColor: '#FF69B4',
                    backgroundColor: 'rgba(255, 105, 180, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: chartDefaults
        });
    </script>
</body>
</html>
