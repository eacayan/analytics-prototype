<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisanal Elevation: Performance Projections</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --obsidian-black: #0B0C10;
            --deep-onyx: #1F2833;
            --brushed-gold: #C5A059;
            --forest-green: #2D5A27;
            --alabaster: #E5E5E5;
            --slate-gray: #A9A9A9;
        }

        body {
            background-color: var(--obsidian-black);
            color: var(--alabaster);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--brushed-gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .sub-headline {
            font-size: 1.2rem;
            color: var(--slate-gray);
            margin-bottom: 20px;
        }

        .disclaimer {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--brushed-gold);
            color: var(--brushed-gold);
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--deep-onyx);
            border-left: 4px solid var(--brushed-gold);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--brushed-gold);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .table-container {
            overflow-x: auto;
            background: var(--deep-onyx);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--brushed-gold);
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid var(--slate-gray);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(169, 169, 169, 0.2);
            color: var(--alabaster);
        }

        tr:hover td {
            background: rgba(197, 160, 89, 0.1);
            transition: background 0.3s ease;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Artisanal Elevation: Performance Projections</h1>
            <div class="sub-headline">Campaign Growth & Retention Modeling</div>
            <div class="disclaimer">SIMULATED DATA: This dashboard contains projected estimates for planning purposes, not measured historical data.</div>
        </header>

        <div class="charts-grid">
            <div class="card">
                <h3>Visitor Growth</h3>
                <canvas id="visitorChart"></canvas>
            </div>
            <div class="card">
                <h3>Conversion Volume</h3>
                <canvas id="conversionChart"></canvas>
            </div>
            <div class="card">
                <h3>Churn Rate Decay</h3>
                <canvas id="churnChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- Data injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const data = [
            { month: 'Month 1', visitors: 1491, conversions: 33, rate: '2.2%', churn: 6.5 },
            { month: 'Month 2', visitors: 1655, conversions: 35, rate: '2.1%', churn: 6.2 },
            { month: 'Month 3', visitors: 1804, conversions: 40, rate: '2.2%', churn: 6.1 },
            { month: 'Month 4', visitors: 2020, conversions: 51, rate: '2.5%', churn: 5.7 },
            { month: 'Month 5', visitors: 2222, conversions: 51, rate: '2.3%', churn: 5.5 },
            { month: 'Month 6', visitors: 2400, conversions: 55, rate: '2.3%', churn: 5.5 },
        ];

        // Populate Table
        const tableBody = document.getElementById('dataTable');
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.month}</td><td>${row.visitors.toLocaleString()}</td><td>${row.conversions}</td><td>${row.rate}</td><td>${row.churn}%</td>`;
            tableBody.appendChild(tr);
        });

        // Chart Defaults
        const chartOptions = {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#E5E5E5', font: { family: 'Montserrat' } } }
            },
            scales: {
                x: { 
                    ticks: { color: '#A9A9A9', font: { family: 'Montserrat' } },
                    grid: { color: 'rgba(169, 169, 169, 0.1)' }
                },
                y: { 
                    ticks: { color: '#A9A9A9', font: { family: 'Montserrat' } },
                    grid: { color: 'rgba(169, 169, 169, 0.1)' }
                }
            }
        };

        const lineStyle = {
            borderColor: '#C5A059',
            backgroundColor: '#C5A059',
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: '#2D5A27',
            tension: 0.3
        };

        // Visitor Chart
        new Chart(document.getElementById('visitorChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.month),
                datasets: [{ label: 'Visitors', data: data.map(d => d.visitors), ...lineStyle }]
            },
            options: chartOptions
        });

        // Conversion Chart
        new Chart(document.getElementById('conversionChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.month),
                datasets: [{ label: 'Conversions', data: data.map(d => d.conversions), ...lineStyle }]
            },
            options: chartOptions
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.month),
                datasets: [{ label: 'Churn Rate (%)', data: data.map(d => d.churn), ...lineStyle }]
            },
            options: chartOptions
        });
    </script>
</body>
</html>
