<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromano Campaign Analytics | Projected Growth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --color-bg: #F2F2F2;
            --color-text: #333333;
            --color-muted: #DBCBBD;
            --color-highlight: #BCAE9E;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .logo-placeholder {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 500;
            margin: 0 0 20px 0;
        }

        .notice-banner {
            background-color: var(--color-muted);
            color: var(--color-text);
            padding: 10px 20px;
            font-size: 0.85rem;
            display: inline-block;
            border-radius: 2px;
            opacity: 0.8;
            font-weight: 300;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .chart-card {
            background: white;
            padding: 30px;
            border: 1px solid var(--color-muted);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-card h3 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin: 0 0 20px 0;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }

        .table-section {
            max-width: 1100px;
            margin: 0 auto 100px auto;
            padding: 0 20px;
        }

        .table-section h2 {
            font-family: var(--font-heading);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid var(--color-muted);
        }

        th {
            text-align: left;
            padding: 15px;
            font-family: var(--font-heading);
            border-bottom: 2px solid var(--color-muted);
            font-weight: 500;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--color-muted);
            font-weight: 300;
        }

        tr:hover td {
            background-color: #fafafa;
            transition: background 0.2s ease;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <span class="logo-placeholder">Aromano</span>
        <h1>Campaign Analytics</h1>
        <div class="notice-banner">
            This dashboard displays simulated/projected estimates for planning purposes.
        </div>
    </header>

    <main>
        <div class="dashboard-grid">
            <div class="chart-card">
                <h3>Projected Visitors</h3>
                <div class="chart-container">
                    <canvas id="visitorsChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Projected Conversions</h3>
                <div class="chart-container">
                    <canvas id="conversionsChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Projected Churn Rate</h3>
                <div class="chart-container">
                    <canvas id="churnChart"></canvas>
                </div>
            </div>
        </div>

        <section class="table-section">
            <h2>Simulated Data Set</h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conversion Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Injected by JS -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const dataSet = [
            { month: 'Month 1', visitors: 1581, conversions: 35, convRate: '2.2%', churn: 6.5 },
            { month: 'Month 2', visitors: 1739, conversions: 38, convRate: '2.2%', churn: 6.3 },
            { month: 'Month 3', visitors: 1948, conversions: 49, convRate: '2.5%', churn: 5.9 },
            { month: 'Month 4', visitors: 2123, conversions: 51, convRate: '2.4%', churn: 5.8 },
            { month: 'Month 5', visitors: 2357, conversions: 61, convRate: '2.6%', churn: 5.5 },
            { month: 'Month 6', visitors: 2546, conversions: 61, convRate: '2.4%', churn: 5.5 },
        ];

        // Populate Table
        const tableBody = document.getElementById('dataTableBody');
        dataSet.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.month}</td>
                <td>${row.visitors}</td>
                <td>${row.conversions}</td>
                <td>${row.convRate}</td>
                <td>${row.churn}%</td>
            `;
            tableBody.appendChild(tr);
        });

        // Chart Configs
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { 
                    grid: { display: false },
                    ticks: { font: { family: 'Inter' } }
                },
                y: { 
                    beginAtZero: false,
                    grid: { color: '#EAEAEA' },
                    ticks: { font: { family: 'Inter' } }
                }
            },
            elements: {
                line: { tension: 0.4 }
            }
        };

        // Visitors Chart
        new Chart(document.getElementById('visitorsChart'), {
            type: 'line',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    data: dataSet.map(d => d.visitors),
                    borderColor: '#333333',
                    backgroundColor: 'rgba(219, 203, 189, 0.3)',
                    fill: true,
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: '#333333'
                }]
            },
            options: commonOptions
        });

        // Conversions Chart
        new Chart(document.getElementById('conversionsChart'), {
            type: 'line',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    data: dataSet.map(d => d.conversions),
                    borderColor: '#BCAE9E',
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: '#BCAE9E'
                }]
            },
            options: commonOptions
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    data: dataSet.map(d => d.churn),
                    borderColor: '#333333',
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: '#333333'
                }]
            },
            options: {
                ...commonOptions,
                scales: {
                    ...commonOptions.scales,
                    y: {
                        ...commonOptions.scales.y,
                        ticks: {
                            callback: value => value + '%'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
