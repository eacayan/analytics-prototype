<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NEW PROFESSIONAL // ANALYTICS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bone: #F5F5F0;
            --charcoal: #1A1A1A;
            --cobalt: #2E5BFF;
            --grey: #A0A0A0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bone);
            color: var(--charcoal);
            font-family: 'JetBrains Mono', monospace;
            padding: 2rem;
            line-height: 1.2;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 3px solid var(--charcoal);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: 'Archivo', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 8vw, 5rem);
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-bottom: 1rem;
        }

        .disclaimer {
            background-color: var(--cobalt);
            color: white;
            display: inline-block;
            padding: 0.5rem 1rem;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            border: 2px solid var(--charcoal);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            border: 3px solid var(--charcoal);
            background: var(--bone);
            padding: 1.5rem;
            position: relative;
        }

        .card-title {
            font-family: 'Archivo', sans-serif;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--charcoal);
            display: inline-block;
        }

        /* Asymmetrical layout */
        .chart-visitors { grid-column: span 8; }
        .chart-conversions { grid-column: span 4; }
        .chart-churn { grid-column: span 12; }

        .table-container {
            grid-column: span 12;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid var(--charcoal);
        }

        th, td {
            border: 2px solid var(--charcoal);
            padding: 0.75rem;
            text-align: left;
        }

        th {
            background-color: var(--charcoal);
            color: var(--bone);
            text-transform: uppercase;
            font-family: 'Archivo', sans-serif;
        }

        @media (max-width: 768px) {
            .chart-visitors, .chart-conversions, .chart-churn {
                grid-column: span 12;
            }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>THE NEW PROFESSIONAL // ANALYTICS</h1>
        <div class="disclaimer">STATUS: SIMULATED/PROJECTED DATA FOR PLANNING PURPOSES</div>
    </header>

    <div class="dashboard-grid">
        <div class="card chart-visitors">
            <div class="card-title">Visitors Growth</div>
            <canvas id="visitorsChart"></canvas>
        </div>
        <div class="card chart-conversions">
            <div class="card-title">Conversion Volume</div>
            <canvas id="convChart"></canvas>
        </div>
        <div class="card chart-churn">
            <div class="card-title">Churn Rate Trend</div>
            <canvas id="churnChart"></canvas>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const PROJECTED_DATA = {
            labels: ['Month 1', 'Month 2', 'Month 3', 'Month 4', 'Month 5', 'Month 6'],
            visitors: [1324, 1470, 1602, 1794, 1973, 2131],
            conversions: [29, 29, 30, 34, 39, 47],
            convRate: [2.2, 2.0, 1.9, 1.9, 2.0, 2.2],
            churnRate: [6.5, 6.2, 6.1, 5.7, 5.5, 5.5]
        };

        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { color: '#A0A0A0' },
                    ticks: { color: '#1A1A1A', font: { family: 'JetBrains Mono' } }
                },
                y: {
                    grid: { color: '#A0A0A0' },
                    ticks: { color: '#1A1A1A', font: { family: 'JetBrains Mono' } }
                }
            }
        };

        // Visitors Chart
        new Chart(document.getElementById('visitorsChart'), {
            type: 'line',
            data: {
                labels: PROJECTED_DATA.labels,
                datasets: [{
                    data: PROJECTED_DATA.visitors,
                    borderColor: '#2E5BFF',
                    borderWidth: 3,
                    tension: 0,
                    pointBackgroundColor: '#1A1A1A'
                }]
            },
            options: { ...chartDefaults }
        });

        // Conversions Chart
        new Chart(document.getElementById('convChart'), {
            type: 'bar',
            data: {
                labels: PROJECTED_DATA.labels,
                datasets: [{
                    data: PROJECTED_DATA.conversions,
                    backgroundColor: '#2E5BFF',
                    borderColor: '#1A1A1A',
                    borderWidth: 2
                }]
            },
            options: { ...chartDefaults }
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: PROJECTED_DATA.labels,
                datasets: [{
                    data: PROJECTED_DATA.churnRate,
                    borderColor: '#2E5BFF',
                    borderWidth: 3,
                    tension: 0,
                    pointBackgroundColor: '#1A1A1A'
                }]
            },
            options: { ...chartDefaults }
        });

        // Populate Table
        const tbody = document.getElementById('data-table-body');
        PROJECTED_DATA.labels.forEach((label, i) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${label}</td>
                <td>${PROJECTED_DATA.visitors[i]}</td>
                <td>${PROJECTED_DATA.conversions[i]}</td>
                <td>${PROJECTED_DATA.convRate[i]}%</td>
                <td>${PROJECTED_DATA.churnRate[i]}%</td>
            `;
            tbody.appendChild(row);
        });
    </script>
</body>
</html>
